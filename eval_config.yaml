# Per-task budgets. The scorer reads exactly these four keys; missing key = no limit (host, discussion 743063).
# Tasks run SEQUENTIALLY and the 12 h limit (agent phase + sandbox setup, excl. grading) currently FAILS
# the whole submission when exceeded (host, 743964: fix "not yet" live).
# V1.2: ~116 test tasks (public LB = 58, see docs/budget_model.md). Worst case, every task at the cap:
#   15 min server + 116 x (5.5 + 0.15) min = 11.2 h; even 120 tasks = 11.55 h (validator errors above 12 h).
# Tool calls/turns raised so that time, not the call count, is the binding cap: third-party official-harness
# runs measured 3.5-5.6 s per tool call, so V1.1's 60 calls could end a task at ~3.5-5.5 min.
evaluation:
  max_time_minutes: 5.5   # hard cap on the agent loop (asyncio.timeout in swegemma agent_runner)
  max_tool_calls: 80
  max_turns: 100
  timeout_seconds: 300    # per command AND the cap on the Phase-2 hidden-test pytest run (verification.py)
