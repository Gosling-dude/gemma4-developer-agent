# Per-task budgets. The scorer reads exactly these four keys; missing key = no limit (host, discussion 743063).
# Tasks run SEQUENTIALLY and the 12 h limit (agent phase + sandbox setup, excl. grading) currently FAILS
# the whole submission when exceeded. Worst case: ~125 tasks x (5.0 + ~0.1 setup) min + ~15 min server
# start = ~10.9 h. See docs/budget_model.md.
evaluation:
  max_time_minutes: 5.0   # hard cap on the agent loop (asyncio.timeout in swegemma agent_runner)
  max_tool_calls: 60      # set so the time cap, not the call cap, binds
  max_turns: 80
  timeout_seconds: 300    # per command AND the cap on the Phase-2 hidden-test pytest run (verification.py)
