# Per-task budgets for Stage-1 inference (HARNESS_README section 7.1).
# The run has 12 h for about 120 hidden tasks INCLUDING sandbox setup. Assuming sequential execution:
#   120 x (4.5 min + ~0.75 min setup) ~= 10.5 h  -> about 1.5 h safety margin.
# The harness default (60 min/task) would exceed 12 h under that assumption.
evaluation:
  max_time_minutes: 4.5   # wall clock inside the agent loop (primary governor)
  max_tool_calls: 40      # budget-gated calls; the time limit usually binds first
  max_turns: 60           # LLM turns
  timeout_seconds: 120    # per run_command; long enough for targeted pytest
