# Stage 1 of R012-v13-handoff: read-only localizer. Read-only by construction: no run_command, edit_file,
# write_file or submit_patch, and only the read-only repo-navigation skill (nav.py find/show/read/usages).
# The graph tools stay registered because the harness prompt advertises them (an undeclared tool call raises
# ValueError in ADK and ends the task). Its final reply is stored in session state as repair_plan.
name: localizer
model: gemma-4-31b-it-qat-w4a16-ct
description: Read-only localization; returns a five-line repair plan (FILE, SYMBOL, CAUSE, EDIT, CHECK).
instruction: !include ../prompts/localizer.md
output_key: repair_plan
tools:
  - read_file
  - get_status
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
skills:
  - skills/repo-navigation
generate_content_config: !include ../configs/localizer_sampling.yaml
