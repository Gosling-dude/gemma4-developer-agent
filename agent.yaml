# R012-v13-handoff: V1.3 (R009 build, 121bd79) split into two forced stages; one hypothesis: a committed,
# read-only localization handoff before any edit raises resolution (wrong-fix/wrong-file = 50% of valid failures,
# docs/r009.md, docs/r010.md). Stage 1 has no write tools; stage 2 is the V1.3 coder unchanged except for how
# it receives the issue and the plan (prompts/system.md). eval_config.yaml budgets are shared by both stages.
# A harness nudge (turn ended without submit_patch) re-runs the whole sequence; the localizer then repeats its
# plan without tool calls (prompts/localizer.md). Nudges: 0 of 30 tasks in R008-R010.
name: swe_handoff
agent_class: SequentialAgent
description: Read-only localization handoff, then the V1.3 coder edits, verifies and submits.
sub_agents:
  - config_path: sub_agents/localizer.yaml
  - config_path: sub_agents/coder.yaml
