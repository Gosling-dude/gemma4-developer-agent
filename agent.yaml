# R017-budget-fit: a faithful adaptation of the Budget-Fit single agent (verracodeguacas), whose archive members
# byte-match the bundle independently reproduced at 0.18 public (dmitriigluzdov, docs/r017.md). Same 9 harness tools,
# sampling (configs/sampling.yaml, reference bytes: T 0.2, thinking on with thoughts kept, budget 4096, 8192 max out)
# and eval_config.yaml (reference bytes: 8 min, 28 tool calls (enforced by the harness), 240 s, 80 turns).
# Differences from the reference: the name (swe_coder, as in R016, for comparable traces), our code-edit skill as the
# safe-edit fallback, and one prompt bullet that says when to use it.
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Resolves a software issue in /workspace with a minimal, tested patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
skills:
  - skills/code-edit
generate_content_config: !include configs/sampling.yaml
