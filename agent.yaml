# R019-tool-loop-guard: R017's Budget-Fit single agent (verracodeguacas recipe; docs/r017.md) with its tool budget
# guarded against the waste the R017/R018 traces show (docs/r019.md). agent.yaml, configs/sampling.yaml,
# eval_config.yaml and skills/code-edit are R017's: same model, 9 harness tools, sampling (T 0.2, thinking on with
# thoughts kept, budget 4096, 8192 max out), budgets (8 min, 28 calls enforced by the harness, 240 s, 80 turns).
# Only prompts/system.md changes: scratch files through run_command heredocs in /tmp (write_file to /tmp is rejected
# and still costs a call), the code-edit fallback keyed to the edit_file error that occurs, a finish step (one check +
# git status, cleanup, one submit), and a stop rule for an empty patch at the call cap (prompt-level: submit_patch is
# uncounted and no submission-side callback can intercept it).
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Resolves a software issue in /workspace with a minimal, tested patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
skills:
  - skills/code-edit
generate_content_config: !include configs/sampling.yaml
