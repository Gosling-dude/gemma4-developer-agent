# R016-single-agent: the R015 coder (R014 prompt order, thinking on with thoughts kept) is the root; the read-only
# localizer stage of R012-R015 is removed. On the 2026-10-09 harness that stage cost a median ~230 s of the 330 s
# task budget with thinking on, and 5/24 R015 sessions never left it (docs/r015.md). The root receives the harness
# task message directly (issue, budget, environment rules, workspace tree), so include_contents stays default.
# Same model, tools, skills, sampling (configs/sampling.yaml) and eval_config.yaml as R015's coder stage.
# search_similar_code stays registered only because the harness prompt advertises it; the prompt says not to use it.
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Resolves a software issue in /workspace with a minimal, tested patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
skills:
  - skills/repo-navigation
  - skills/test-discovery
  - skills/debugging
  - skills/code-edit
generate_content_config: !include configs/sampling.yaml
