# Generation parameters for every agent (loaded via !include).
# Budget-driven choices (see docs/competition_notes.md "Budget analysis"):
# - thinking_budget 1024: at roughly 4.5 min per task, long thinking dominates wall-clock time.
# - max_output_tokens 6144: room for thinking plus a mid-sized edit_file payload. Too low cuts off
#   tool calls (the harness then nudges, which costs a turn); too high lets a runaway turn burn time.
# - temperature 0.3: a mostly deterministic tool-use policy, with a little diversity to escape loops.
temperature: 0.3
top_p: 0.95
top_k: 64
max_output_tokens: 6144
thinking_config:
  thinking_budget: 1024
  include_thoughts: true
