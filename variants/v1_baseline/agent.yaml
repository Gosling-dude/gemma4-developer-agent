# V1: single disciplined coder agent + 3 skills (production default).
# Sub-agents are deliberately off: each delegation costs extra model turns inside a ~4.5 min budget.
# See docs/experiments.md for the V0/V1/V2 comparison plan.
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Resolves a software issue in /workspace with a minimal, tested patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
skills:
  - skills/repo-navigation
  - skills/test-discovery
  - skills/debugging
generate_content_config: !include configs/sampling.yaml
