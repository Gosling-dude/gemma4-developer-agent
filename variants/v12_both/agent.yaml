# Multi-agent experiment on V1.2: V1.2 (root) + code_analyzer and patch_reviewer as AgentTool(s).
# The prompt is the V1.2 prompt plus one specialists section (tests/test_variants.py enforces this).
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Resolves a software issue in /workspace with a minimal, tested patch.
instruction: !include prompts/system_v12_both.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
  - agent_tool:
      config_path: sub_agents/patch_reviewer.yaml
      skip_summarization: true
skills:
  - skills/repo-navigation
  - skills/test-discovery
  - skills/debugging
  - skills/code-edit
generate_content_config: !include configs/sampling.yaml
