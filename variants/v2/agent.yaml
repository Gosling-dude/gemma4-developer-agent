# V2: V1 plus two AgentTool specialists that keep exploration and review out of the root context.
# code_analyzer: read-only localization -> structured report
# patch_reviewer: reads the diff, checks it against the issue -> verdict
# Hypothesis: better localization on large repos; cost: extra model turns per task.
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Resolves a software issue in /workspace with a minimal, tested patch.
instruction: !include prompts/system_v2.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
  - agent_tool:
      config_path: sub_agents/patch_reviewer.yaml
      skip_summarization: true
skills:
  - skills/repo-navigation
  - skills/test-discovery
  - skills/debugging
generate_content_config: !include configs/sampling.yaml
