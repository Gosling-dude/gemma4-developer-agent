# V1.3: single disciplined coder agent + 4 skills (production default).
# V1.3 = V1.2 + a two-step edit channel (code in a run_command heredoc, then code-edit `lines ... @/tmp/file`),
# a first-edit deadline and a no-re-read rule; evidence in docs/v1_3.md. Sub-agents stay off: each delegation
# costs extra model turns inside a 5.5 min budget (variants/v12_* measure that trade-off).
# search_similar_code stays registered only because the harness advertises it (an unregistered call raises and
# discards the patch); the prompt tells the model not to use it.
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Resolves a software issue in /workspace with a minimal, tested patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
skills:
  - skills/repo-navigation
  - skills/test-discovery
  - skills/debugging
  - skills/code-edit
generate_content_config: !include configs/sampling.yaml
