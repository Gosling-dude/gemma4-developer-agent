# Stage 2 of R012-v13-handoff: the V1.3 root agent (121bd79) moved here unchanged: same model, tools, skills,
# sampling and edit channel. Only two keys differ: the include paths (now relative to sub_agents/) and
# include_contents: none, so the coder starts from the localizer's final reply instead of carrying the
# localizer's tool output; the issue and the plan reach it through {problem_description} / {repair_plan?}.
# search_similar_code stays registered only because the harness advertises it (an unregistered call raises and
# discards the patch); the prompt tells the model not to use it.
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Resolves a software issue in /workspace with a minimal, tested patch.
instruction: !include ../prompts/system.md
include_contents: none
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
skills:
  - skills/repo-navigation
  - skills/test-discovery
  - skills/debugging
  - skills/code-edit
generate_content_config: !include ../configs/sampling.yaml
