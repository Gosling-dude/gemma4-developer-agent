# V1.1 generation parameters (loaded via !include by every agent).
# VERIFIED in adk-submission 0.2.11 (resolvers/generation.py) and in the request the official harness sends:
#   thinking_config only toggles chat_template_kwargs.enable_thinking; thinking_budget is NOT enforced.
#   include_thoughts: false -> enable_thinking: false (thinking off).
# Thinking off: every scored public notebook (0.08-0.12) runs this way; with thinking on, each turn can
# emit up to max_output_tokens of reasoning inside a ~5 min task budget. Ablation: variants/v1_think.
temperature: 0.3
top_p: 0.95
top_k: 64
max_output_tokens: 6144
thinking_config:
  include_thoughts: false
