# V1.2: single disciplined coder agent + 4 skills (production default).
# V1.2 adds code-edit (escape-tolerant, syntax-checked edits; see docs/v1_2.md). Sub-agents stay off:
# each delegation costs extra model turns inside a 5.5 min budget; variants/v2 measures that trade-off.
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Resolves a software issue in /workspace with a minimal, tested patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
skills:
  - skills/repo-navigation
  - skills/test-discovery
  - skills/debugging
  - skills/code-edit
generate_content_config: !include configs/sampling.yaml
