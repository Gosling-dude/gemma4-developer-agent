# R015 generation parameters (loaded via !include by the coder; the localizer mirrors them at T 0.1).
# VERIFIED in adk-submission 0.2.13 resolvers/generation.py (wheelhouse of 2026-10-09): include_thoughts: true ->
# chat_template_kwargs.enable_thinking=true and prior thoughts are kept across tool calls; thinking_budget is now
# forwarded as thinking_token_budget (4096 = the harness default and every >= 0.18 public bundle; < max_output_tokens
# so the visible tool call keeps >= 2048 tokens).
# R015 turns thinking on (V1.1-R014 ran it off). Evidence: a controlled 129-task ablation (discussion 746250)
# resolved 48 with thinking on vs 23 with it off, and every public bundle scoring >= 0.18 runs thinking on
# (docs/r015_research.md). Everything else is unchanged from R014.
temperature: 0.3
top_p: 0.95
top_k: 64
max_output_tokens: 6144
thinking_config:
  thinking_budget: 4096
  include_thoughts: true
